name: Build & Release

# 触发方式：
#  1) 推 tag（如 v0.1.5）→ 自动构建 macOS(arm64) + Windows(x64) 并创建 GitHub Release
#  2) 仓库页面 Actions → Build & Release → Run workflow（只构建，产物在 run 的 Artifacts 里）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows x64（CPU 版引擎，无 GPU）────────────────────────────
  # 必须在 Windows 运行器上构建：better-sqlite3 是原生模块，node-gyp 不支持从 macOS 交叉编译到 Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build renderer/main/preload
        run: npm run build
      - name: Fetch Windows ffmpeg (not stored in the repo, ~83MB)
        shell: bash
        run: bash scripts/fetch-win-ffmpeg.sh
      - name: Package (NSIS installer + portable zip)
        run: npx electron-builder --win --x64 --publish never
        env:
          # 没有 Windows 代码签名证书：明确关闭签名，但不关闭 exe 元数据/图标编辑（由 resedit 完成，无需 wine）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  # ── macOS arm64 ────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build renderer/main/preload
        run: npm run build

      # 有 Developer ID 证书时才做「正式签名 + 公证」；没有就 ad-hoc 签名（用户需按 README 绕过 Gatekeeper）
      - name: Import Developer ID certificate (optional)
        if: ${{ secrets.MAC_CERT_P12 != '' }}
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p actions /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions /tmp/build.keychain
          rm -f /tmp/cert.p12

      - name: Package (signed when certificate present)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never

      - name: Ad-hoc deep sign (no certificate)
        if: ${{ secrets.MAC_CERT_P12 == '' }}
        run: bash scripts/sign-adhoc.sh

      - name: Notarize + staple (only with certificate)
        if: ${{ secrets.MAC_CERT_P12 != '' && secrets.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # ── 打 tag 时创建 Release ──────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ── Android 复习客户端（可选任务）─────────────────────────────
  # 需要仓库 Secrets：ANDROID_KEYSTORE_BASE64（keystore 的 base64）、
  #                  ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
  # 没有这些 secret 时该任务自动跳过（不失败），APK 仍可用「局域网直传」分发。
  android-apk:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: echo "has=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.has == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.check.outputs.has == 'true'
        uses: android-actions/setup-android@v3
      - if: steps.check.outputs.has == 'true'
        name: Decode keystore
        run: |
          mkdir -p "$HOME/.whispernotes"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.whispernotes/android-release.jks"
          cat > mobile/android/keystore.properties <<EOF
          storeFile=$HOME/.whispernotes/android-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - if: steps.check.outputs.has == 'true'
        name: Build APK
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
      - if: steps.check.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WhisperNotes-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
